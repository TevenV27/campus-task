<section class="hoja">
  <header class="cabecera">
    <p class="marca">Curso</p>
    <h1>CampusTasks</h1>
    <p class="subtitulo">Tareas del curso</p>
  </header>

  <div>
    <input type="text" #tituloInput />
    <button (click)="crear(tituloInput.value)">Agregar</button>
  </div>
  <ul>
    @for (tarea of tareas(); track tarea.id) {

    <li>
      <span class="numero">{{ tarea.id }}</span>

      @if (editandoId() === tarea.id) {
        <!-- MODO EDICIÓN: Aparece cuando el ID coincide -->
        <input type="text" [value]="tarea.titulo" #editarInput />
        <button (click)="actualizar(tarea.id, editarInput.value); editandoId.set(null)">Guardar</button>
        <button (click)="editandoId.set(null)">Cancelar</button>
      } @else {
        <!-- MODO NORMAL: El que ves por defecto -->
        <span class="titulo">{{ tarea.titulo }}</span>
        <button (click)="editandoId.set(tarea.id)">Editar</button>
        <button (click)="eliminar(tarea.id)">Eliminar</button>
      }
    </li>
    }
  </ul>
</section>
