<section class="hoja">
  <header class="cabecera">
    <p class="marca">Curso</p>
    <h1>CampusTasks</h1>
    <p class="subtitulo">Tareas del curso</p>
  </header>

  <div>
    <input type="text" #tituloInput />
    <button (click)="crear(tituloInput.value)">Agregar</button>
  </div>

  <ul>
    @for (tarea of tareas(); track tarea.id) {

    <li>
      <span class="numero">{{ tarea.id }}</span>

      @if (tareaEditandoId === tarea.id) {
        
          <input type="text" [(ngModel)]="tituloEditado"/>
          <button (click)="guardarEdicion()">Guardar</button>

        } @else {

          <span class="titulo">{{ tarea.titulo }}</span>
          <button (click)="editar(tarea)"> Editar</button>
          <button (click)="eliminar(tarea.id)"> Eliminar</button>
        }
    </li>
    }
  </ul>
</section>
