<section class="hoja">
  <header class="cabecera">
    <p class="marca">Curso</p>
    <h1>CampusTasks</h1>
    <p class="subtitulo">Tareas del curso</p>
  </header>

  <div>
    <input type="text" #tituloInput />
    <button (click)="crear(tituloInput.value)">Agregar</button>
  </div>

  @if (error()) {
  <p class="error">{{ error() }}</p>
  }

  <ul>
    @for (tarea of tareas(); track tarea.id) {
    <li class="caja-tarea">
      <span class="numero">{{ tarea.id }}</span>
      @if (editandoId() === tarea.id) {
      <input type="text" class="edicion" [value]="tarea.titulo" #edicionInput />
      <div class="caja-botones">
        <button (click)="guardar(tarea.id, edicionInput.value)">Guardar</button>
        <button (click)="cancelar()">Cancelar</button>
      </div>
      } @else {
      <span class="titulo">{{ tarea.titulo }}</span>
      <div class="caja-botones">
        <button (click)="editar(tarea.id)">Editar</button>
        <button (click)="eliminar(tarea.id)">Eliminar</button>
      </div>
      }
    </li>
    }
  </ul>
</section>
